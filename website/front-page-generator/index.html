<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Front Page Generator - KGEC Pages</title>
  <meta name="description" content="Design an assignment front page, preview it live and export print-ready PDFs for one or many students at once. Runs in your browser.">
  <link rel="canonical" href="https://dwaidatta.in/kgec-pages/front-page-generator/">
  <meta property="og:site_name" content="KGEC Pages">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dwaidatta.in/kgec-pages/front-page-generator/">
  <meta property="og:title" content="Front Page Generator - KGEC Pages">
  <meta property="og:description" content="Design an assignment front page, preview it live and export print-ready PDFs for one or many students at once. Runs in your browser.">
  <meta property="og:image" content="https://dwaidatta.in/kgec-pages/assets/images/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Front Page Generator - KGEC Pages">
  <meta name="twitter:description" content="Design an assignment front page, preview it live and export print-ready PDFs for one or many students at once. Runs in your browser.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="icon" href="../assets/images/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../assets/images/kgec-pages-icon.svg">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>

<body class="page-generator">
  <div id="navbar-root"></div>

  <div class="generator-layout">

    <div class="generator-preview custom-scroll">
      <div class="a4-sheet-outer">
        <div class="a4-sheet">
          <iframe id="preview-frame" class="a4-frame" scrolling="no" src="./front-page/front-page.html"></iframe>
        </div>
      </div>
    </div>

    <div class="generator-sidebar custom-scroll">
      <div class="d-flex flex-column gap-3">

        <!-- Make for -->
        <div class="card">
          <div class="card-header"><i class="bi bi-people"></i> Generate for</div>
          <div class="card-body custom-scroll" style="max-height: 180px; overflow-y: auto;">
            <p class="form-text mt-0 mb-2">Tick the saved students to export a front page for. Add students in Settings.</p>
            <div id="make-for-list" class="d-flex flex-column gap-1"></div>
          </div>
        </div>

        <!-- Layout -->
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-layout-text-window"></i> Layout</span>
            <span id="layout-lock-badge" class="badge text-bg-secondary d-none"><i class="bi bi-lock-fill"></i> Locked</span>
          </div>
          <div class="card-body d-flex flex-column gap-2">
            <p class="form-text mt-0 mb-0">Start from a saved layout, then save your changes as new or overwrite it.</p>
            <select id="layout-select" class="form-select"></select>
            <div class="d-flex gap-2">
              <button id="btn-save-layout" class="btn btn-outline-secondary flex-fill">Save as new</button>
              <button id="btn-overwrite-layout" class="btn btn-outline-secondary flex-fill">Overwrite</button>
            </div>
          </div>
        </div>

        <!-- Page margin -->
        <div class="card">
          <div class="card-header"><i class="bi bi-arrows-angle-expand"></i> Page Margins (mm)</div>
          <div class="card-body d-flex flex-column gap-2">
            <div>
              <label class="form-label">Left</label>
              <input type="number" id="margin-left" class="form-control">
            </div>
            <div>
              <label class="form-label">Right</label>
              <input type="number" id="margin-right" class="form-control">
            </div>
            <div>
              <label class="form-label">Top</label>
              <input type="number" id="margin-top" class="form-control">
            </div>
            <div>
              <label class="form-label">Bottom</label>
              <input type="number" id="margin-bottom" class="form-control">
            </div>
          </div>
        </div>

        <!-- Page border -->
        <div class="card">
          <div class="card-header"><i class="bi bi-square"></i> Page Border</div>
          <div class="card-body">
            <label class="form-label" for="border-thickness">Thickness (mm)</label>
            <input type="number" id="border-thickness" class="form-control" min="0" max="5" step="0.5">
          </div>
        </div>

        <!-- College emblem -->
        <div class="card">
          <div class="card-header"><i class="bi bi-shield-check"></i> College Emblem</div>
          <div class="card-body d-flex flex-column gap-2">
            <div>
              <label class="form-label">Size (mm)</label>
              <input type="number" id="emblem-size" class="form-control">
            </div>
            <div class="d-flex flex-column gap-1">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="emblem-style" id="emblem-straight" value="straight">
                <label class="form-check-label" for="emblem-straight">Straight text</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="emblem-style" id="emblem-curved" value="curved">
                <label class="form-check-label" for="emblem-curved">Curved text</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Title space -->
        <div class="card">
          <div class="card-header"><i class="bi bi-fonts"></i> Title Lines</div>
          <div class="card-body">
            <div id="title-lines" class="d-flex flex-column gap-3"></div>
            <button id="btn-add-title-line" class="btn btn-sm btn-outline-primary mt-2 w-100">
              <i class="bi bi-plus"></i> Add line
            </button>
          </div>
        </div>

        <!-- Details space -->
        <div class="card">
          <div class="card-header"><i class="bi bi-card-list"></i> Detail Fields</div>
          <div class="card-body d-flex flex-column gap-3">
            <div>
              <label class="form-label">Font size (all fields)</label>
              <input type="number" id="fs-details" class="form-control">
            </div>
            <div id="details-rows" class="d-flex flex-column gap-3"></div>
            <button id="btn-add-detail-row" class="btn btn-sm btn-outline-primary w-100">
              <i class="bi bi-plus"></i> Add field
            </button>
          </div>
        </div>

        <!-- Academic session -->
        <div class="card">
          <div class="card-header"><i class="bi bi-calendar3"></i> Academic Session</div>
          <div class="card-body d-flex flex-column gap-2">
            <div>
              <label class="form-label">Font size</label>
              <input type="number" id="fs-session" class="form-control">
            </div>
            <div>
              <label class="form-label">Session text</label>
              <input type="text" id="session-text" class="form-control" placeholder="2025 - 2026">
            </div>
            <div class="d-flex flex-column gap-1">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="session-mode" id="session-show-text"
                  value="showText">
                <label class="form-check-label" for="session-show-text">Show the session text</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="session-mode" id="session-only-year"
                  value="onlyYear">
                <label class="form-check-label" for="session-only-year">Show the year only</label>
              </div>
            </div>
          </div>
        </div>

        <!-- Save -->
        <div class="card cta-card">
          <div class="card-body d-flex flex-column gap-2">
            <button id="btn-save-pdf" class="btn btn-primary btn-lg w-100">
              <i class="bi bi-file-earmark-pdf"></i> Export PDF
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module" src="./index.js"></script>

</html>
