<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>MultiMerge - KGEC Pages</title>
  <meta name="description" content="Group PDFs, reorder pages by dragging and export each group as one merged PDF. Runs in your browser.">
  <link rel="canonical" href="https://dwaidatta.in/kgec-pages/multimerge/">
  <meta property="og:site_name" content="KGEC Pages">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dwaidatta.in/kgec-pages/multimerge/">
  <meta property="og:title" content="MultiMerge - KGEC Pages">
  <meta property="og:description" content="Group PDFs, reorder pages by dragging and export each group as one merged PDF. Runs in your browser.">
  <meta property="og:image" content="https://dwaidatta.in/kgec-pages/assets/images/og-image.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MultiMerge - KGEC Pages">
  <meta name="twitter:description" content="Group PDFs, reorder pages by dragging and export each group as one merged PDF. Runs in your browser.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <link rel="icon" href="../assets/images/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../assets/images/kgec-pages-icon.svg">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="page-multimerge">
  <div id="navbar-root"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>MultiMerge</h1>
      <a href="../index.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div class="merge-toolbar d-flex flex-wrap align-items-center gap-2 mb-4">
      <button id="btn-add-group" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add</button>
      <button id="btn-delete-groups" class="btn btn-outline-danger" disabled><i class="bi bi-trash"></i> Delete</button>
      <button id="btn-merge-save" class="btn btn-success" disabled><i class="bi bi-file-earmark-pdf"></i> Merge and save</button>
      <div class="form-check ms-auto mb-0">
        <input class="form-check-input" type="checkbox" id="select-all-groups">
        <label class="form-check-label" for="select-all-groups">Select all</label>
      </div>
    </div>

    <div id="groups-list" class="d-flex flex-column gap-3"></div>

    <div id="empty-state" class="empty-state d-none">
      <i class="bi bi-files empty-state-icon"></i>
      <h5>No Merge Groups Yet</h5>
      <p class="mb-0">Click "Add" to create a group, then add PDFs to it and merge them into one file.</p>
    </div>

    <input type="file" id="file-input" accept="application/pdf" multiple hidden>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./index.js"></script>
</html>
