name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Unit and end-to-end tests (the same ones CI runs); the deploy only starts if they pass.
  tests:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump version and create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          LATEST_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' || true)"
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"

          VERSION_CORE="${LATEST_TAG#v}"
          MAJOR="$(echo "$VERSION_CORE" | cut -d. -f1)"
          MINOR="$(echo "$VERSION_CORE" | cut -d. -f2)"
          PATCH="$(echo "$VERSION_CORE" | cut -d. -f3)"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${LATEST_TAG} -> ${NEW_VERSION} (${BUMP})"

          gh release create "${NEW_VERSION}" \
            --target "${{ github.sha }}" \
            --title "Release ${NEW_VERSION}" \
            --notes "Automated Pages deployment (Build #${{ github.run_number }})"

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Read version metadata from the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api "repos/${{ github.repository }}/releases/tags/${NEW_VERSION}")"

          TAG_NAME="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          TARGET_COMMIT="$(echo "$RELEASE_JSON" | jq -r '.target_commitish')"
          CREATED_AT="$(echo "$RELEASE_JSON" | jq -r '.created_at')"

          {
            echo "TAG_NAME=${TAG_NAME}"
            echo "SHORT_SHA=${TARGET_COMMIT:0:6}"
            echo "ISO_DATE=${CREATED_AT}"
            echo "UPDATE_DATE=$(date -u -d "${CREATED_AT}" +'%d %b %Y')"
          } >> "$GITHUB_ENV"

      - name: Generate version metadata
        run: |
          mkdir -p website/assets/config
          cat <<EOF > website/assets/config/version.json
          {
            "repoUrl": "${{ github.server_url }}/${{ github.repository }}",
            "version": "${TAG_NAME}",
            "buildNumber": ${{ github.run_number }},
            "commitHash": "${SHORT_SHA}",
            "updatedDate": "${UPDATE_DATE}",
            "isoDate": "${ISO_DATE}"
          }
          EOF

          echo "Generated version metadata: ${TAG_NAME} (${SHORT_SHA})"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
